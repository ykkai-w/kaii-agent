name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:main
      - run: npm run test:renderer
      - run: npm run build
      - run: npm run audit:public
